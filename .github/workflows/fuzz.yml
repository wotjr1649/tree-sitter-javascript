name: Fuzz Parser

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Run fuzzer
        uses: tree-sitter/fuzz-action@v4
        with:
          tree-sitter-version: v0.27.2
